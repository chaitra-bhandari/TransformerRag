version: 2

# Python version and dependencies
python:
  version: '3.9'
  install:
    - requirements: docs/requirements.txt
    - path: .

# Sphinx configuration
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Build configuration
build:
  os: ubuntu-22.04
  tools:
    python: '3.9'

# Formats
formats:
  - pdf
  - epub
